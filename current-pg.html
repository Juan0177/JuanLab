<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guida PG attuale | JuanLab</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="assets/css/style.css?v=20260923-1" />
  <link rel="stylesheet" href="assets/css/current-pg.css?v=20261030-1" />
</head>
<body>
  <canvas id="stars"></canvas>

  <main class="container current-pg-page">
    <header>
      <div class="hero-brand">
        <a href="index.html" class="back-link">&larr; JuanLab</a>
        <div class="hero-divider"></div>
        <strong class="hero-title">Guida PG attuale</strong>
      </div>
    </header>

    <section class="current-pg-worksite" aria-label="Guida di Mitya in lavorazione">
      <div class="worksite-warning" aria-hidden="true"></div>
      <div class="worksite-orbit" aria-hidden="true">
        <div class="orbit-ring orbit-ring-outer"></div>
        <div class="orbit-ring orbit-ring-inner"></div>
        <div class="orbit-track">
          <img class="orbit-avatar orbit-avatar-top" src="assets/img/characters/UI_AvatarIcon_Mitya.webp" alt="" width="256" height="256" />
        </div>
        <div class="worksite-core">
          <span class="worksite-status">Cantiere in corso</span>
          <strong>Guida in preparazione</strong>
          <small>Mitya sta arrivando</small>
        </div>
      </div>
      <div class="worksite-barrier" aria-hidden="true">
        <span class="barrier-light barrier-light-left"></span>
        <span class="barrier-board barrier-board-top"></span>
        <span class="barrier-board barrier-board-bottom"></span>
        <span class="barrier-leg barrier-leg-left"></span>
        <span class="barrier-leg barrier-leg-right"></span>
        <span class="barrier-light barrier-light-right"></span>
      </div>
      <div class="worksite-copy">
        <div class="worksite-message">
          <h1 class="page-title-font">Work in progress</h1>
          <p class="current-pg-kicker">Guida Rapida | Mitya &middot; versione 7.2</p>
          <p>
          Pagina temporanea in aggiornamento: la guida di <strong>Mitya</strong> &egrave; in preparazione.
          </p>
        </div>
      </div>

      <div class="worksite-poof" aria-hidden="true">
        <span class="poof-cloud poof-cloud-1"></span>
        <span class="poof-cloud poof-cloud-2"></span>
        <span class="poof-cloud poof-cloud-3"></span>
        <span class="poof-cloud poof-cloud-4"></span>
        <span class="poof-cloud poof-cloud-5"></span>
        <span class="poof-cloud poof-cloud-6"></span>
        <span class="poof-sfx">Poof!</span>
      </div>
    </section>
  </main>

  <footer class="container">
    <small>JuanLab &mdash; Guida PG attuale</small>
  </footer>

  <script src="assets/js/main.js?v=20260923-1"></script>
</body>
</html>
